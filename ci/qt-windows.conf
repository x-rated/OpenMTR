# Qt configure flags for the static Windows build (.github/workflows/build.yml).
#
# Kept in its own file so the CI cache key can be a hash of it: change a flag
# here and the cached Qt is rebuilt automatically, with no cache-busting
# counter to remember to bump. One flag (or its value) per line; blank lines
# and #-comments are ignored. Paths (-prefix, the build dir) stay in the
# workflow — they are not configuration and would make the hash churn for no
# reason.
#
# The long -no-feature-* list is why the Windows artifacts are ~7 MB against
# macOS's 11 and Linux's 16: everything the app never instantiates is compiled
# out of Qt entirely rather than shipped and left unused.

-release
-static
-static-runtime
-platform
win32-msvc
-no-opengl
-c++std
c++20
-nomake
examples
-nomake
tests

