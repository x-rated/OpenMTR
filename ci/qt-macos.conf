# Qt configure flags for the static macOS build (.github/workflows/build.yml).
#
# Kept in its own file so the CI cache key can be a hash of it: change a flag
# here and the cached Qt is rebuilt automatically. One flag (or its value)
# per line; blank lines and #-comments are ignored. Paths (-prefix, the build
# dir) and the deployment target stay in the workflow.
#
# Derived from ci/qt-windows.conf, minus what is Windows-specific
# (-static-runtime, -platform win32-msvc, the two Windows styles) and minus
# the file-dialog cluster: Windows exports through native GetSaveFileNameW so
# it compiles QFileDialog out entirely, but the macOS branch of onExport()
# calls QFileDialog::getSaveFileName() (the native NSSavePanel comes through
# it), so filedialog and the widgets its UI is built from — combobox, list
# and tree views, splitter, filesystemmodel, mimetype — have to stay in, or
# configure silently disables filedialog and the app stops compiling.

-release
-static
-no-opengl
-c++std
c++20
-nomake
examples
-nomake
tests

-no-feature-sql
-no-feature-printsupport
-no-feature-concurrent
-no-feature-systemtrayicon
-no-feature-whatsthis
-no-feature-wizard
-no-feature-colordialog
-no-feature-fontdialog
-no-feature-mdiarea
-no-feature-dockwidget
-no-feature-jpeg
-no-feature-gif
-no-feature-imageformat_ppm
-no-feature-imageformat_xbm
# imageformat_xpm stays IN, unlike Windows, because draganddrop needs it:
# qtbase's src/gui/configure.cmake declares
#   qt_feature("draganddrop" ... CONDITION QT_FEATURE_imageformat_xpm)
# so disabling xpm silently turns draganddrop off — and the Cocoa platform
# plugin does not compile without draganddrop (see below).
-no-feature-image_heuristic_mask
-no-feature-image_text
-no-feature-movie
-no-feature-picture
# draganddrop stays IN, unlike Windows: the Cocoa platform plugin does not
# compile without it (qcocoadrag.h includes qpa/qplatformdrag.h
# unconditionally, with no QT_CONFIG guard — verified by a failed CI build).
# Merely not disabling it is not enough — its imageformat_xpm dependency
# above must stay in too, or configure switches it off again silently.
-no-feature-pdf
-no-feature-tabletevent
-no-feature-sessionmanager
# texthtmlparser stays IN, unlike Windows: the Cocoa plugin's
# qcocoamessagedialog.mm is compiled unconditionally and calls
# QTextDocument::setHtml() without a guard.
-no-feature-textmarkdownreader
-no-feature-textmarkdownwriter
-no-feature-textodfwriter
-no-feature-emojisegmenter
-no-feature-gestures
-no-feature-translation
-no-feature-undocommand
-no-feature-undostack
-no-feature-undogroup
-no-feature-statustip
-no-feature-tabbar
-no-feature-tabwidget
-no-feature-fontcombobox
-no-feature-listwidget
-no-feature-treewidget
-no-feature-toolbox
-no-feature-calendarwidget
-no-feature-datetimeedit
-no-feature-dial
-no-feature-lcdnumber
-no-feature-rubberband
-no-feature-sizegrip
-no-feature-textedit
-no-feature-textbrowser
-no-feature-progressbar
-no-feature-progressdialog
-no-feature-inputdialog
-no-feature-messagebox
-no-feature-errormessage
-no-feature-undoview
-no-feature-accessibility
-no-feature-graphicsview
-no-feature-graphicseffect
# The macOS widget style is compiled out, mirroring the Windows conf's
# -no-feature-style-windowsvista/-windows11. Two reasons: QMacStyle
# unconditionally #includes headers of a dozen trimmed widgets (qtextedit,
# qwizard, qdockwidget, qprogressbar, ...) so it cannot build against this
# feature set at all, and the app never uses it — every control is styled by
# the app's own stylesheets, and the one widget where the style engine truly
# shows (the results table) already forces Fusion via QStyleFactory.
-no-feature-style-mac

-no-feature-network
-no-feature-ssl

-confirm-license
-opensource
