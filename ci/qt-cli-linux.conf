# Qt configure flags for openmtr-cli on Linux (build-cli-linux job).
#
# QtCore only — the CLI needs nothing else — built static like the window
# app's Qt, so the binary carries Qt inside it and needs only glibc and
# libstdc++ at run time. No ICU and no GLib (Qt's own event dispatcher is
# enough for a program with no event loop to speak of), and Qt's bundled
# zlib and PCRE2, so none of those become runtime dependencies either.
# Built on the oldest supported Ubuntu runner so the result runs on older
# distributions too (see the job's comment in build.yml).
#
# One flag or value per line; '#' starts a comment. The cache key hashes
# this file, so editing it rebuilds this Qt and nothing else.
-static
-no-icu
-release
-c++std
c++20
-nomake
examples
-nomake
tests
-confirm-license
-opensource
-no-gui
-no-widgets
-no-dbus
-no-glib
-no-openssl
-qt-zlib
-qt-pcre
-no-feature-network
-no-feature-ssl
-no-feature-sql
-no-feature-concurrent
