# sizegrip stays IN, unlike macOS: the Linux export dialog explicitly calls
# dialog.setSizeGripEnabled(false) at runtime (MainWindow.cpp), which needs
# the feature compiled in even though the app only ever turns it off. macOS
# never calls this — it goes through NSSavePanel instead — so it's free to
