# Qt configure flags for the Linux AppImage build (.github/workflows/build.yml).
#
# Kept in its own file so the CI cache key can be a hash of it: change a flag
# here and the cached Qt is rebuilt automatically, with no cache-busting
# counter to remember to bump. One flag per line; blank lines and #-comments
# are ignored. Paths (-prefix, the build dir) stay in the workflow — they are
# not configuration and would make the hash churn for no reason.

# The reason this build exists at all. Both the distro package and Qt's
# official Linux binaries link libQt6Core against ICU, so linuxdeploy has to
# bundle it — 38 MB unpacked, the AppImage's largest single component. Qt
# falls back to its built-in codecs; the only capability lost is locale-aware
# collation (QCollator), which nothing in this app uses.
-no-icu

-release
-c++std
c++20
-nomake
examples
-nomake
tests
-confirm-license
-opensource

-no-feature-network
-no-feature-ssl

# Same trimming as the Windows build's -no-feature-* list, minus the
# filedialog cluster: MainWindow.cpp's export-results flow uses
# QFileDialog::getSaveFileName() and a non-native QFileDialog (Linux has no
# native save-panel API, unlike Windows' GetSaveFileNameW and macOS's
# NSSavePanel), so filedialog and the widgets its UI is built from —
# combobox, list and tree views, splitter, filesystemmodel, mimetype — have
# to stay in, or configure silently disables filedialog and the app stops
# compiling (confirmed by a failed CI build). Mirrors ci/qt-macos.conf's
# reasoning for the same cluster. Everything below is grep-confirmed unused
# in MainWindow.cpp/tracer.cpp/main.cpp as of this writing; a future feature
# use will need re-checking against this list.
-no-feature-sql
-no-feature-printsupport
-no-feature-concurrent
