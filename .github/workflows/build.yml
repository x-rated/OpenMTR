# ==========================================================================
#  GitHub Actions — build OpenMTR for Windows, macOS and Linux
#
#  Builds static Windows AMD64 + ARM64 binaries, a macOS ARM64 app bundle,
#  and static Linux AMD64 + ARM64 binaries in parallel, and uploads them as
#  artifacts, each downloading as a zip named after the platform and
#  architecture and containing a single, plainly-named executable — the
#  same shape on every platform:
#    OpenMTR-Windows-AMD64.zip / OpenMTR-Windows-ARM64.zip -> OpenMTR.exe
#    OpenMTR-macOS.zip                                     -> OpenMTR.dmg
#    OpenMTR-Linux-AMD64.zip  / OpenMTR-Linux-ARM64.zip     -> OpenMTR.AppImage
#  The Linux build is packaged only as an AppImage (see the "Assemble
#  AppImage" step) — an uncompressed squashfs payload bundling every
#  non-base runtime dependency, double-clickable in file managers that
#  recognise the AppImage MIME type. The raw, un-packaged ELF binary is
#  built (it's what goes into the AppImage) but not uploaded as its own
#  artifact. Triggered on pushes to main, pull requests, or manually.
# ==========================================================================

name: Build

# When the workflow runs.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]

# Cancel an in-progress run when a newer commit is pushed.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: read-only access to the repo.
permissions:
  contents: read

# Shared configuration.
env:
  QT_VERSION: 6.11.1
  # No cache-busting counter here on purpose: the Qt caches key off a hash of
  # the configure flags in ci/qt-*.conf, so they invalidate exactly when that
  # configuration changes and never need a manual bump (forgetting one meant
  # silently shipping artifacts built by the previous configuration).
  #
  # Pin ONE MSVC toolset across both runner images so the AMD64 and ARM64
  # builds link with identical mitigations and codegen (they otherwise resolve
  # different toolsets, e.g. 14.51 vs 14.44). If a job errors that this toolset
  # is unavailable on its runner image, set this to a version present on both
  # windows-latest and windows-11-arm.
  MSVC_TOOLSET: '14.44'

# Build matrix: one job per target architecture.
jobs:
  build-windows:
    strategy:
      matrix:
        include:
          - arch: amd64
            label: Windows AMD64
            runner: windows-latest
            prefix: C:\Qt-static
            artifact: OpenMTR-Windows-AMD64
          - arch: arm64
            label: Windows ARM64
            runner: windows-11-arm
            prefix: C:\Qt-static
            artifact: OpenMTR-Windows-ARM64

    runs-on: ${{ matrix.runner }}
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Restore Qt cache
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: ${{ matrix.prefix }}
          key: qt-static-${{ env.QT_VERSION }}-windows-${{ matrix.arch }}-${{ hashFiles('ci/qt-windows.conf') }}

      - name: Setup MSVC
        # ilammy/msvc-dev-cmd hasn't been touched since Jan 2024 and still
        # ships on Node 20. This is TheMrMilchmann's actively maintained
        # fork — same `arch`/`toolset` inputs (so MSVC_TOOLSET pinning is
        # unaffected), just on the node24 runtime.
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}
          toolset: ${{ env.MSVC_TOOLSET }}

      - name: Ensure Ninja
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y }

      - name: Fetch & patch Qt source
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Series (6.11) derived from QT_VERSION (6.11.1), not written out
          # again: hardcoding it means bumping QT_VERSION alone silently
          # builds a URL like qt/6.11/6.12.0/ that 404s.
          $series = "${{ env.QT_VERSION }}" -replace '\.\d+$', ''
          $base = "https://download.qt.io/official_releases/qt/$series/${{ env.QT_VERSION }}/submodules"
          Invoke-WebRequest "$base/qtbase-everywhere-src-${{ env.QT_VERSION }}.zip" -OutFile qtbase.zip -TimeoutSec 600
          Expand-Archive qtbase.zip -DestinationPath C:\Qt-src

          $file = "C:\Qt-src\qtbase-everywhere-src-${{ env.QT_VERSION }}\src\gui\text\windows\qwindowsfontdatabase_ft.cpp"
          $content = [System.IO.File]::ReadAllText($file)
          $patched = $content.Replace('#include <QtCore/QSettings>', '// #include <QtCore/QSettings> -- removed: QSettings disabled')
          if ($patched -eq $content) { Write-Error "Patch target not found in $file"; exit 1 }
          [System.IO.File]::WriteAllText($file, $patched, [System.Text.UTF8Encoding]::new($false))

      - name: Configure, build & install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Flags come from ci/qt-windows.conf, which the cache key hashes.
          $flags = Get-Content ci\qt-windows.conf |
                   ForEach-Object { $_.Trim() } |
                   Where-Object { $_ -and -not $_.StartsWith('#') }
          $configure = "C:\Qt-src\qtbase-everywhere-src-${{ env.QT_VERSION }}\configure.bat"
          & $configure -prefix ${{ matrix.prefix }} @flags -- -B C:\Qt-build
          if ($LASTEXITCODE -ne 0) { throw "Qt configure failed" }
          cmake --build C:\Qt-build --parallel
          if ($LASTEXITCODE -ne 0) { throw "Qt build failed" }
          cmake --install C:\Qt-build
          if ($LASTEXITCODE -ne 0) { throw "Qt install failed" }

      - name: Generate Qt forwarding headers
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          foreach ($module in @('QtWidgets', 'QtGui', 'QtCore')) {
            $dir = "C:\Qt-static\include\$module"
            if (-not (Test-Path $dir)) { continue }
            foreach ($h in Get-ChildItem $dir -Filter "q*.h") {
              $content = Get-Content $h.FullName -Raw
              $regexMatches = [regex]::Matches($content,
                '(?m)^ *(?:template\s*<[^>]*>\s*)?(?:class|struct)\s+(?:Q_\w+_EXPORT\s+)(Q[A-Za-z0-9_]+)')
              foreach ($m in $regexMatches) {
                $className = $m.Groups[1].Value
                if ($className -match 'Private$') { continue }
                $fwd = Join-Path $dir $className
                if (-not (Test-Path $fwd)) {
                  Set-Content -Path $fwd -Value "#include `"$($h.Name)`"" -Encoding UTF8 -NoNewline
                }
              }
            }
          }

      - name: Build app
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH=${{ matrix.prefix }} ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded && ^
          cmake --build build --parallel

      - name: Verify Control Flow Guard is set in the binary
        # CFG (/guard:cf + /GUARD:CF in CMakeLists.txt) is what tells AV ML
        # classifiers "this was built with a standard exploit mitigation
        # enabled", which measurably cuts false-positive Wacatac-style
        # detections. It's possible for the compile/link flags to be right
        # in CMakeLists.txt but for the resulting PE to not actually carry
        # the bit - e.g. a linker/toolset mismatch on a cross-compiled
        # target silently drops it. dumpbin ships with the dev tools that
        # setup-msvc-dev already put on PATH, so this needs nothing extra
        # installed. Fail loudly rather than ship a binary we assumed was
        # hardened but wasn't.
        shell: pwsh
        run: |
          # dumpbin /headers never prints the string "Guard Control Flow Guard" -
          # a CFG binary's DLL characteristics just list the bare word "Guard".
          # /loadconfig is the reliable check: it confirms the guard tables
          # themselves are present, not just a characteristics-flag substring.
          $loadconfig = dumpbin /loadconfig build\OpenMTR.exe
          if ($loadconfig -match 'CF Instrumented' -and $loadconfig -match 'FID table present') {
            Write-Host "Control Flow Guard confirmed present in build\OpenMTR.exe"
          } else {
            Write-Error "Control Flow Guard bit is MISSING from build\OpenMTR.exe - /guard:cf/GUARD:CF did not take effect for this target"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: build\OpenMTR.exe

  # macOS now builds the same way as Windows: a static, feature-trimmed Qt
  # compiled from source (flags in ci/qt-macos.conf, cached by their hash),
  # linked straight into the executable. No macdeployqt, no bundled
  # frameworks, no plugins to prune — the whole bundle is one binary, and
  # CMakeLists.txt links the Cocoa platform plugin in statically. The
  # trimmed feature set is the Windows list minus the QFileDialog cluster
  # (see the .conf's own comment). Qt6Network isn't linked at all — the
  # update check shells out to /usr/bin/curl instead (see MainWindow.cpp).
  #
  # Earlier iterations used Homebrew's Qt (compiled for the runner's own OS
  # release — bundles silently required the newest macOS while declaring
  # 12.0 — plus 35 MB of ICU/glib/dbus) and then official dynamic binaries
  # (correct, but ~22 MB of frameworks for the ~10 MB DMG). Static-trimmed
  # is the same approach that keeps Windows below 8 MB.
  build-macos:
    runs-on: macos-latest
    name: Build (macOS ARM64)
    env:
      # GitHub-hosted macOS runners come with a handful of taps (e.g.
      # aws/tap) pre-added but untrusted; recent Homebrew refuses to use
      # anything from them until trusted, which surfaces as a noisy warning
      # on every `brew install` in this job even though nothing here uses
      # those taps.
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Restore Qt cache
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: ~/qt-macos-static
          key: qt-static-macos-arm64-${{ env.QT_VERSION }}-${{ hashFiles('ci/qt-macos.conf') }}

      - name: Ensure Ninja
        run: command -v ninja >/dev/null || brew install ninja

      - name: Fetch Qt source
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          # Series (6.11) derived from QT_VERSION (6.11.1) — see the Windows
          # job for why it isn't written out a second time.
          series="${QT_VERSION%.*}"
          base="https://download.qt.io/official_releases/qt/$series/${QT_VERSION}/submodules"
          curl -sfL --retry 3 -o qtbase.tar.xz \
            "$base/qtbase-everywhere-src-${QT_VERSION}.tar.xz"
          tar xf qtbase.tar.xz

      - name: Configure, build & install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          # Flags come from ci/qt-macos.conf, which the cache key hashes.
          # awk 'NF{...}': see the Linux job for why not sed with \s.
          # while-read, not mapfile: macOS runners execute run: steps with
          # Apple's bash 3.2, which predates mapfile (a bash 4 builtin).
          QT_FLAGS=()
          while IFS= read -r flag; do QT_FLAGS+=("$flag"); done \
            < <(sed 's/#.*//' "$GITHUB_WORKSPACE/ci/qt-macos.conf" \
                | tr -d '\r' | awk 'NF{$1=$1; print}')
          echo "Qt flags: ${QT_FLAGS[*]}"
          cd "qtbase-everywhere-src-${QT_VERSION}"
          # The deployment target must match the app's (CMakeLists.txt):
          # static Qt objects compiled for a newer macOS would silently
          # raise the real minimum above what Info.plist declares — the
          # smoke test and minos check below both guard the result.
          ./configure -prefix "$HOME/qt-macos-static" "${QT_FLAGS[@]}" \
            -- -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -B "$HOME/qt-build"
          cmake --build "$HOME/qt-build" --parallel
          cmake --install "$HOME/qt-build" --strip

      - name: Configure & build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/qt-macos-static"
          cmake --build build --parallel

      - name: Ad-hoc sign
        # One binary, no nested code — a single codesign is the whole
        # inside-out order now.
        run: codesign --force --sign - build/OpenMTR.app

      - name: Smoke-test the bundle actually launches
        # The exact failure users report ("it crashed on my Mac") never
        # showed up in CI because nothing here ever ran the app. macOS
        # runners have a real Aqua session, so launch the bundle and require
        # it to still be alive after 8 s — that catches dyld kills, missing
        # plugins, unrecognized-selector aborts, anything that dies at
        # startup. Only on the runner's own macOS, so not proof against
        # other releases, but strictly better than never executing it.
        run: |
          ./build/OpenMTR.app/Contents/MacOS/OpenMTR & app_pid=$!
          sleep 8
          if ! kill -0 "$app_pid" 2>/dev/null; then
            wait "$app_pid"; code=$?
            echo "::error::App exited within 8 s of launch (exit $code)"
            exit 1
          fi
          kill "$app_pid"
          echo "App survived launch."

      - name: Verify every bundled binary runs on the declared minimum OS
        # The exact regression this job used to ship: a bundle whose
        # Info.plist promises one macOS version but whose libraries need a
        # newer one, so it launches on the runner and dies with dyld errors
        # on users' machines. Fail the build instead. The bar is read from
        # the built Info.plist rather than hardcoded, so it tracks
        # CMAKE_OSX_DEPLOYMENT_TARGET on its own.
        run: |
          declared=$(plutil -extract LSMinimumSystemVersion raw \
                       build/OpenMTR.app/Contents/Info.plist)
          echo "Bundle declares macOS $declared"
          fail=0
          while IFS= read -r f; do
            file -b "$f" | grep -q 'Mach-O' || continue
            minos=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{b=1} b && /minos/{print $2; exit}')
            [ -n "$minos" ] || continue
            # Full version compare via sort -V, not just the major component:
            # a library needing 13.4 in a bundle declaring 13.0 still crashes
            # on 13.0-13.3. sort -V also handles a three-part minos (13.4.1),
            # which splitting into major/minor by hand would truncate.
            if [ "$(printf '%s\n%s\n' "$declared" "$minos" | sort -V | tail -1)" != "$declared" ]; then
              echo "::error::$f requires macOS $minos but the bundle declares $declared"
              fail=1
            fi
          done < <(find build/OpenMTR.app -type f)
          exit $fail

      - name: Package into a DMG
        run: |
          # create-dmg rather than bare hdiutil: hdiutil can only produce the
          # app and an /Applications alias dropped into a default Finder
          # window — no window size, no icon placement, no background. It
          # drives the same Finder/AppleScript setup by hand that every
          # polished .dmg uses.
          brew install create-dmg

          # The background is optional so the workflow works before the
          # artwork exists (see packaging/dmg-background-template.svg for the
          # layout it has to match). Retina needs both sizes combined into
          # one HiDPI TIFF; a lone 1x PNG would be upscaled and soft.
          bg=()
          if [ -f packaging/dmg-background@2x.png ] && [ -f packaging/dmg-background.png ]; then
            tiffutil -cathidpicheck packaging/dmg-background.png \
                                    packaging/dmg-background@2x.png -out dmg-bg.tiff
            bg=(--background dmg-bg.tiff)
          elif [ -f packaging/dmg-background.png ]; then
            bg=(--background packaging/dmg-background.png)
          fi

          # ULFO (lzfse), set directly on create-dmg rather than built as a
          # temp image and hdiutil-converted afterwards — create-dmg takes
          # --format itself, so the extra convert/rm round trip bought
          # nothing.
          #
          # Deliberately NOT UDRO (uncompressed). That was an attempt to pull
          # the .dmg's entropy profile down toward the statically-linked
          # Windows .exe's, on the theory that a compressed data fork reads
          # as near-random to a scanner. Measured on a realistic payload
          # (13.6 MB of compiled Qt code):
          #
          #     ULFO  4.9 MB    UDZO  5.5 MB    UDRO  13.9 MB
          #
          # so UDRO costs ~2.5x for a hypothesis that was never measured
          # end-to-end. Two things make that a bad trade here specifically:
          # Wacatac.B!ml is a Windows Defender detection, and a macOS user
          # opening a .dmg never runs Defender against it; and no release has
          # ever shipped a .dmg at all (1.0.0 was a .zip, 1.1.0/1.2.0 are the
          # two .exe files), so the only thing UDRO changed was the
          # VirusTotal score of a CI artifact nobody downloads.
          #
          # ULFO is also the smallest of the three, so this is not a
          # size-vs-safety compromise — it's smaller than the UDZO default
          # that the original entropy concern was raised against.
          create-dmg \
            --volname "OpenMTR" \
            --volicon build/app_icon.icns \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "OpenMTR.app" 170 190 \
            --app-drop-link 430 190 \
            --hide-extension "OpenMTR.app" \
            --no-internet-enable \
            --format ULFO \
            "${bg[@]}" \
            build/OpenMTR.dmg \
            build/OpenMTR.app

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: OpenMTR-macOS
          path: build/OpenMTR.dmg

  # Linux links Qt statically (ci/qt-linux.conf), same approach as the
  # Windows job below: the shipped OpenMTR binary needs nothing from the Qt
  # build at runtime, only ordinary system libraries (glibc, libstdc++,
  # X11/xcb, D-Bus) that any desktop already has. That makes it a single
  # portable ELF file — copy it anywhere (a USB stick included) and run it,
  # no install step and no self-extracting bundle/runtime to unpack first.
  # Two architectures, like the Windows matrix — but unlike Windows
  # (cross-compiled via the ARM64 MSVC toolset), each runs natively on
  # GitHub's own AMD64/ARM64 Linux runners, so there's no cross-compilation
  # to set up. Runs on ubuntu-26.04.
  #
  # Qt is built from source rather than taken from apt, for two reasons:
  # -static (apt's Qt is dynamic-only) and -no-icu. Both the distro package
  # and Qt's own official Linux binaries link libQt6Core against
  # libicui18n/libicuuc/libicudata; Qt falls back to its own built-in codecs
  # without it, and the only real loss is locale-aware collation
  # (QCollator), which nothing here uses. Same from-source approach as the
  # Windows jobs, and cached the same way, so only the first run per
  # architecture pays for it.
  #
  # Deliberately NOT carrying over the Windows job's long -no-feature-* list:
  # that needs someone who can verify the result on a real Linux desktop.
  build-linux:
    strategy:
      matrix:
        include:
          - arch: amd64
            label: Linux AMD64
            runner: ubuntu-26.04
            artifact: OpenMTR-Linux-AMD64
            appimage_arch: x86_64
          - arch: arm64
            label: Linux ARM64
            runner: ubuntu-26.04-arm
            artifact: OpenMTR-Linux-ARM64
            appimage_arch: aarch64

    runs-on: ${{ matrix.runner }}
    name: Build (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Restore Qt cache
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: ~/qt-noicu
          # Hashing this job's own flag file keeps it independent of the
          # Windows caches: editing Linux's Qt configuration rebuilds only
          # Linux's Qt.
          key: qt-noicu-${{ env.QT_VERSION }}-linux-${{ matrix.arch }}-${{ hashFiles('ci/qt-linux.conf') }}

      - name: Install build dependencies
        # Qt's xcb platform plugin needs the whole xcb dev set present at
        # configure time or it is silently skipped, leaving a Qt that cannot
        # open a window — hence the long list, and the explicit check after
        # the install step below.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config squashfs-tools \
            libgl1-mesa-dev libegl1-mesa-dev \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
            libxcb-render-util0-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev \
            libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libdbus-1-dev libglib2.0-dev zlib1g-dev libssl-dev

      - name: Fetch Qt source
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          # Series (6.11) derived from QT_VERSION (6.11.1) — see the Windows
          # job for why it isn't written out a second time.
          series="${QT_VERSION%.*}"
          base="https://download.qt.io/official_releases/qt/$series/${QT_VERSION}/submodules"
          wget -q "$base/qtbase-everywhere-src-${{ env.QT_VERSION }}.tar.xz"
          tar xf "qtbase-everywhere-src-${{ env.QT_VERSION }}.tar.xz"

      - name: Configure, build & install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          # Flags come from ci/qt-linux.conf, which the cache key hashes.
          # Read before the cd, since that file is in the workspace.
          # awk 'NF{...}' drops blank lines first, then trims — the NF test
          # has to come before touching $1, since assigning to it on an empty
          # record creates a field and makes NF true. Not sed with \s either:
          # that is a GNU extension, and a BSD sed matches a literal "s",
          # quietly turning -nomake examples into -nomake example.
          mapfile -t QT_FLAGS < <(sed 's/#.*//' "$GITHUB_WORKSPACE/ci/qt-linux.conf" \
                                  | tr -d '\r' | awk 'NF{$1=$1; print}')
          echo "Qt flags: ${QT_FLAGS[*]}"
          cd "qtbase-everywhere-src-${{ env.QT_VERSION }}"
          ./configure -prefix "$HOME/qt-noicu" "${QT_FLAGS[@]}" -- -B "$HOME/qt-build"
          cmake --build "$HOME/qt-build" --parallel
          # --strip: a from-source Qt keeps its .symtab/.strtab, which the
          # distro packages ship stripped (their symbols live in separate
          # -dbgsym packages) and which end up statically linked into
          # OpenMTR otherwise, for symbols no end user has any use for.
          cmake --install "$HOME/qt-build" --strip

      - name: Verify the Qt build is usable
        # A Qt without the xcb platform plugin builds and installs fine and
        # then fails at runtime with "could not load the Qt platform plugin",
        # which no CI step would otherwise catch. Also re-checks the one
        # thing this from-source build exists to guarantee. Static build:
        # both the plugin and Qt6Core are .a archives now, not .so, so this
        # checks archive membership instead of readelf's dynamic section.
        run: |
          plugin="$HOME/qt-noicu/plugins/platforms/libqxcb.a"
          if [ ! -f "$plugin" ]; then
            echo "::error::Qt built without the xcb platform plugin — the app could not open a window."
            ls -R "$HOME/qt-noicu/plugins" || true
            exit 1
          fi
          if find "$HOME/qt-noicu/lib" -maxdepth 1 -name 'libicu*' | grep -q .; then
            echo "::error::libQt6Core still links ICU despite -no-icu."
            exit 1
          fi
          echo "xcb plugin present; libQt6Core is ICU-free."

      - name: Configure & build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/qt-noicu" \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel

      - name: Install & strip
        # Same shape as the Linux install rules already in CMakeLists.txt
        # (GNUInstallDirs, POST_BUILD objcopy split of debug info): this just
        # runs them into a throwaway prefix instead of a distro root. Because
        # Qt itself is static (ci/qt-linux.conf), the resulting
        # out/bin/OpenMTR needs nothing from $HOME/qt-noicu at runtime — only
        # ordinary system libraries (glibc, libstdc++, X11/xcb, D-Bus) that
        # any desktop already has, the same trade-off the Windows/macOS
        # builds already make for their own system frameworks.
        run: |
          cmake --install build --prefix out
          echo "Runtime dependencies (all expected to be system libraries):"
          ldd out/bin/OpenMTR

      - name: Verify no Qt/ICU libraries leaked in as shared objects
        # Confirms the build actually stayed static: if a stray dynamic
        # libQt6*.so or libicu*.so shows up in ldd's output, -static in
        # ci/qt-linux.conf silently didn't take (e.g. a stale non-static Qt
        # cache hit) and the binary would only run on machines that happen to
        # have those libraries installed — defeating the point of this job.
        run: |
          if ldd out/bin/OpenMTR | grep -Ei 'libQt6|libicu'; then
            echo "::error::OpenMTR still links Qt or ICU dynamically — the static Qt build wasn't used."
            exit 1
          fi
          echo "No dynamic Qt/ICU dependencies; only system libraries remain."

      - name: Assemble AppImage (uncompressed, self-contained payload)
        # A regular AppImage is [runtime][squashfs], and appimagetool's
        # squashfs is compressed (zstd) by default. A block of compressed
        # data reads as near-random entropy to a scanner — the same shape
        # as a packer/dropper payload — which is what made the earlier
        # AppImage builds of this project trip Microsoft's Wacatac ML
        # heuristic on VirusTotal (see the macOS DMG step above, which hit
        # the identical entropy problem and fixed it the same way: drop the
        # compression). mksquashfs's -noI/-noD/-noF/-noX disable inode,
        # data, fragment and xattr compression respectively, so the payload
        # stores OpenMTR's bytes close to as-is instead of as a compressed
        # blob — same entropy profile as the plain out/bin/OpenMTR binary
        # built above, just wrapped in AppImage's [runtime][squashfs]
        # container so double-clicking it in a file manager that recognises
        # the AppImage MIME type (e.g. GNOME Files with Gearlever/
        # AppImageLauncher installed) launches it directly.
        #
        # Bundling runtime deps: out/bin/OpenMTR still dynamically needs
        # ordinary desktop libraries (X11/xcb — including helper libs like
        # libxcb-cursor that aren't guaranteed present on every install —
        # D-Bus, fontconfig, freetype...). The whole point of AppImage is
        # not needing the target system to already have those, so this
        # walks `ldd`'s output and copies every resolved dependency except
        # the small base set every glibc Linux ships (libc/ld-linux/
        # libpthread/libm/libdl/librt/libresolv/libgcc_s — mixing a
        # bundled libc with the host kernel's is what actually breaks
        # portability, so those stay off the target's own copies). AppRun
        # points LD_LIBRARY_PATH at the bundled copies before exec'ing the
        # real binary.
        #
        # NOTE ON WHAT THIS DOES AND DOESN'T GUARANTEE: Wacatac.B!ml/C!ml
        # is an opaque ML classifier, not a documented rule — dropping the
        # compression removes one concrete, previously-confirmed trigger
        # for it, matching the same fix already validated on the macOS
        # side of this project, but no build change can *guarantee* an ML
        # AV engine won't flag a given binary. If this build still trips
        # Wacatac, the next lever to pull is code-signing (see the
        # deferred-due-to-cost note in CMakeLists.txt) — an unsigned
        # binary is itself a heavily-weighted signal for these classifiers,
        # on every platform, independent of the container format.
        run: |
          set -e
          APPDIR="$RUNNER_TEMP/OpenMTR.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp out/bin/OpenMTR "$APPDIR/usr/bin/OpenMTR"
          cp openmtr.desktop "$APPDIR/usr/share/applications/openmtr.desktop"
          cp app_icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/openmtr.png"

          # Bundle every dynamic dependency ldd can resolve, except the
          # base glibc/toolchain set assumed present (and required to
          # match the host's own copy) on every target.
          echo "Runtime dependencies being bundled into usr/lib:"
          ldd out/bin/OpenMTR | sed -n 's/^[^ ]* => \(\/[^ ]*\).*/\1/p' | while read -r lib; do
            case "$(basename "$lib")" in
              ld-linux*|libc.so.*|libm.so.*|libdl.so.*|libpthread.so.*|librt.so.*|libresolv.so.*|libgcc_s.so.*)
                continue ;;
            esac
            echo "  $lib"
            cp -L "$lib" "$APPDIR/usr/lib/"
          done

          # AppImage spec: the desktop file and icon must also sit at the
          # AppDir root (not just under usr/share/...). AppRun is the
          # actual entry point the runtime execs — a real script here
          # (not a bare symlink) so it can point the dynamic linker at
          # the bundled usr/lib before handing off to the real binary.
          cp openmtr.desktop "$APPDIR/openmtr.desktop"
          cp app_icon.png "$APPDIR/openmtr.png"
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'export LD_LIBRARY_PATH="$HERE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec "$HERE/usr/bin/OpenMTR" "$@"' \
            > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          mksquashfs "$APPDIR" "$RUNNER_TEMP/OpenMTR.squashfs" \
            -root-owned -noappend -no-exports \
            -noI -noD -noF -noX

          runtime_url="https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${{ matrix.appimage_arch }}"
          echo "Fetching AppImage runtime: $runtime_url"
          curl -sfL --retry 3 -o "$RUNNER_TEMP/runtime" "$runtime_url"
          chmod +x "$RUNNER_TEMP/runtime"

          cat "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/OpenMTR.squashfs" \
            > "OpenMTR.AppImage"
          chmod +x "OpenMTR.AppImage"

      # Only the AppImage is uploaded — the raw out/bin/OpenMTR ELF above
      # exists solely as the AppImage's payload, matching the "one zip, one
      # plainly-named executable" shape the Windows/macOS jobs already use
      # (OpenMTR-Windows-AMD64.zip -> OpenMTR.exe, OpenMTR-macOS.zip ->
      # OpenMTR.dmg), instead of shipping a bare, un-packaged ELF that most
      # users have no direct use for.
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: OpenMTR.AppImage
