# ==========================================================================
#  GitHub Actions — build OpenMTR for Windows, macOS and Linux
#
#  Builds static Windows AMD64 + ARM64 binaries, a static macOS ARM64 app
#  bundle, and static Linux AMD64 + ARM64 AppImages in parallel (every
#  platform links a feature-trimmed Qt built from source in CI - see each
#  job below), and uploads them as artifacts
#  (each downloads as OpenMTR-Windows-<ARCH>.zip / OpenMTR-macOS.zip /
#  OpenMTR-Linux-x86_64.zip, containing a plain OpenMTR.exe / OpenMTR.dmg /
#  OpenMTR-x86_64.AppImage respectively). Triggered on pushes to main, pull
#  requests, or manually.
# ==========================================================================

name: Build

# When the workflow runs.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]

# Cancel an in-progress run when a newer commit is pushed.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: read-only access to the repo.
permissions:
  contents: read

# Shared configuration (Qt version + cache-busting suffix).
env:
  QT_VERSION: 6.11.1
  # Bumped to v2 to force a Qt rebuild: QtNetwork forwarding headers now
  # need to be generated too (added for the update checker).
  QT_CACHE_SUFFIX: v1
  # Pin ONE MSVC toolset across both runner images so the AMD64 and ARM64
  # builds link with identical mitigations and codegen (they otherwise resolve
  # different toolsets, e.g. 14.51 vs 14.44). If a job errors that this toolset
  # is unavailable on its runner image, set this to a version present on both
  # windows-latest and windows-11-arm.
  MSVC_TOOLSET: '14.44'

# Build matrix: one job per target architecture.
jobs:
  build-windows:
    strategy:
      matrix:
        include:
          - arch: amd64
            label: Windows AMD64
            runner: windows-latest
            prefix: C:\Qt-static
            artifact: OpenMTR-Windows-AMD64
          - arch: arm64
            label: Windows ARM64
            runner: windows-11-arm
            prefix: C:\Qt-static
            artifact: OpenMTR-Windows-ARM64

    runs-on: ${{ matrix.runner }}
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Restore Qt cache
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: ${{ matrix.prefix }}
          key: qt-static-${{ env.QT_VERSION }}-${{ matrix.arch }}-${{ env.QT_CACHE_SUFFIX }}

      - name: Setup MSVC
        # ilammy/msvc-dev-cmd hasn't been touched since Jan 2024 and still
        # ships on Node 20. This is TheMrMilchmann's actively maintained
        # fork — same `arch`/`toolset` inputs (so MSVC_TOOLSET pinning is
        # unaffected), just on the node24 runtime.
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}
          toolset: ${{ env.MSVC_TOOLSET }}

      - name: Ensure Ninja
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y }

      - name: Fetch & patch Qt source
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $base = "https://download.qt.io/official_releases/qt/6.11/${{ env.QT_VERSION }}/submodules"
          Invoke-WebRequest "$base/qtbase-everywhere-src-${{ env.QT_VERSION }}.zip" -OutFile qtbase.zip -TimeoutSec 600
          Expand-Archive qtbase.zip -DestinationPath C:\Qt-src

          $file = "C:\Qt-src\qtbase-everywhere-src-${{ env.QT_VERSION }}\src\gui\text\windows\qwindowsfontdatabase_ft.cpp"
          $content = [System.IO.File]::ReadAllText($file)
          $patched = $content.Replace('#include <QtCore/QSettings>', '// #include <QtCore/QSettings> -- removed: QSettings disabled')
          if ($patched -eq $content) { Write-Error "Patch target not found in $file"; exit 1 }
          [System.IO.File]::WriteAllText($file, $patched, [System.Text.UTF8Encoding]::new($false))

      - name: Configure, build & install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          C:\Qt-src\qtbase-everywhere-src-${{ env.QT_VERSION }}\configure.bat ^
            -prefix ${{ matrix.prefix }} ^
            -release -static -static-runtime ^
            -platform win32-msvc ^
            -no-opengl ^
            -c++std c++20 ^
            -nomake examples -nomake tests ^
            -no-feature-sql -no-feature-printsupport -no-feature-concurrent ^
            -no-feature-systemtrayicon -no-feature-whatsthis -no-feature-wizard ^
            -no-feature-colordialog -no-feature-fontdialog ^
            -no-feature-mdiarea -no-feature-dockwidget ^
            -no-feature-jpeg -no-feature-gif ^
            -no-feature-imageformat_ppm ^
            -no-feature-imageformat_xbm -no-feature-imageformat_xpm ^
            -no-feature-image_heuristic_mask -no-feature-image_text ^
            -no-feature-movie ^
            -no-feature-picture ^
            -no-feature-draganddrop ^
            -no-feature-pdf ^
            -no-feature-tabletevent ^
            -no-feature-sessionmanager ^
            -no-feature-texthtmlparser ^
            -no-feature-textmarkdownreader -no-feature-textmarkdownwriter ^
            -no-feature-textodfwriter ^
            -no-feature-emojisegmenter ^
            -no-feature-gestures ^
            -no-feature-translation ^
            -no-feature-undocommand -no-feature-undostack -no-feature-undogroup ^
            -no-feature-statustip ^
            -no-feature-tabbar -no-feature-tabwidget ^
            -no-feature-combobox -no-feature-fontcombobox ^
            -no-feature-listview -no-feature-listwidget ^
            -no-feature-treeview -no-feature-treewidget ^
            -no-feature-splitter ^
            -no-feature-filedialog -no-feature-filesystemmodel ^
            -no-feature-mimetype ^
            -no-feature-toolbox ^
            -no-feature-calendarwidget -no-feature-datetimeedit ^
            -no-feature-dial -no-feature-lcdnumber ^
            -no-feature-rubberband -no-feature-sizegrip ^
            -no-feature-textedit -no-feature-textbrowser ^
            -no-feature-progressbar -no-feature-progressdialog ^
            -no-feature-inputdialog -no-feature-messagebox -no-feature-errormessage ^
            -no-feature-undoview ^
            -no-feature-accessibility ^
            -no-feature-style-windowsvista ^
            -no-feature-style-windows11 ^
            -no-feature-graphicsview -no-feature-graphicseffect ^
            -confirm-license -opensource ^
            -- -B C:\Qt-build && ^
          cmake --build C:\Qt-build --parallel && ^
          cmake --install C:\Qt-build

      - name: Generate Qt forwarding headers
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          foreach ($module in @('QtWidgets', 'QtGui', 'QtCore', 'QtNetwork')) {
            $dir = "C:\Qt-static\include\$module"
            if (-not (Test-Path $dir)) { continue }
            foreach ($h in Get-ChildItem $dir -Filter "q*.h") {
              $content = Get-Content $h.FullName -Raw
              $regexMatches = [regex]::Matches($content,
                '(?m)^ *(?:template\s*<[^>]*>\s*)?(?:class|struct)\s+(?:Q_\w+_EXPORT\s+)(Q[A-Za-z0-9_]+)')
              foreach ($m in $regexMatches) {
                $className = $m.Groups[1].Value
                if ($className -match 'Private$') { continue }
                $fwd = Join-Path $dir $className
                if (-not (Test-Path $fwd)) {
                  Set-Content -Path $fwd -Value "#include `"$($h.Name)`"" -Encoding UTF8 -NoNewline
                }
              }
            }
          }

      - name: Build app
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH=${{ matrix.prefix }} ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded && ^
          cmake --build build --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: build\OpenMTR.exe

  # macOS now builds Qt from source too, the same way Windows does: a
  # static, feature-trimmed Qt instead of the full dynamic Homebrew build
  # that used to get bundled wholesale into the .app via macdeployqt. That
  # old approach copied entire unstripped Qt frameworks (plus their Homebrew
  # dependency dylibs) into every .app - by far the biggest contributor to
  # the old DMG size. One difference from the Windows feature list: this
  # platform's export dialog goes through Qt's own QFileDialog (see
  # MainWindow.cpp's Q_OS_WIN vs. else branch), unlike Windows' native
  # GetSaveFileNameW - so filedialog/filesystemmodel/sizegrip stay enabled
  # here even though Windows disables them.
  build-macos:
    runs-on: macos-latest
    name: Build (macOS ARM64)
    env:
      QT_PREFIX: /Users/runner/Qt-static
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Restore Qt cache
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.QT_PREFIX }}
          key: qt-static-${{ env.QT_VERSION }}-macos-arm64-${{ env.QT_CACHE_SUFFIX }}

      - name: Install Ninja
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: brew install ninja

      - name: Fetch Qt source
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          base="https://download.qt.io/official_releases/qt/6.11/${{ env.QT_VERSION }}/submodules"
          curl -fL "$base/qtbase-everywhere-src-${{ env.QT_VERSION }}.tar.xz" -o qtbase.tar.xz --max-time 600
          mkdir -p /Users/runner/Qt-src
          tar -xf qtbase.tar.xz -C /Users/runner/Qt-src

      - name: Configure, build & install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          cd /Users/runner/Qt-src/qtbase-everywhere-src-${{ env.QT_VERSION }}
          ./configure \
            -prefix "$QT_PREFIX" \
            -release -static \
            -platform macx-clang \
            -no-opengl \
            -c++std c++20 \
            -nomake examples -nomake tests \
            -no-feature-sql -no-feature-printsupport -no-feature-concurrent \
            -no-feature-systemtrayicon -no-feature-whatsthis -no-feature-wizard \
            -no-feature-colordialog -no-feature-fontdialog \
            -no-feature-mdiarea -no-feature-dockwidget \
            -no-feature-jpeg -no-feature-gif \
            -no-feature-imageformat_ppm \
            -no-feature-imageformat_xbm \
            -no-feature-image_heuristic_mask -no-feature-image_text \
            -no-feature-movie \
            -no-feature-picture \
            -no-feature-pdf \
            -no-feature-textmarkdownreader -no-feature-textmarkdownwriter \
            -no-feature-textodfwriter \
            -no-feature-emojisegmenter \
            -no-feature-translation \
            -no-feature-undocommand -no-feature-undostack -no-feature-undogroup \
            -no-feature-statustip \
            -no-feature-tabbar -no-feature-tabwidget \
            -no-feature-fontcombobox \
            -no-feature-listwidget \
            -no-feature-treewidget \
            -no-feature-mimetype \
            -no-feature-toolbox \
            -no-feature-calendarwidget -no-feature-datetimeedit \
            -no-feature-dial -no-feature-lcdnumber \
            -no-feature-rubberband \
            -no-feature-textedit -no-feature-textbrowser \
            -no-feature-progressbar -no-feature-progressdialog \
            -no-feature-inputdialog -no-feature-messagebox -no-feature-errormessage \
            -no-feature-undoview \
            -no-feature-style-mac \
            -no-feature-graphicsview -no-feature-graphicseffect \
            -confirm-license -opensource \
            -- -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -B /Users/runner/Qt-build
          cmake --build /Users/runner/Qt-build --parallel
          cmake --install /Users/runner/Qt-build

      - name: Generate Qt forwarding headers
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 - "$QT_PREFIX" <<'PY'
          import re, pathlib, sys
          prefix = pathlib.Path(sys.argv[1])
          pattern = re.compile(
              r'^ *(?:template\s*<[^>]*>\s*)?(?:class|struct)\s+(?:Q_\w+_EXPORT\s+)(Q[A-Za-z0-9_]+)',
              re.M)
          for module in ('QtWidgets', 'QtGui', 'QtCore', 'QtNetwork'):
              d = prefix / 'include' / module
              if not d.is_dir():
                  continue
              for h in d.glob('q*.h'):
                  content = h.read_text(errors='ignore')
                  for m in pattern.finditer(content):
                      name = m.group(1)
                      if name.endswith('Private'):
                          continue
                      fwd = d / name
                      if not fwd.exists():
                          fwd.write_text(f'#include "{h.name}"')
          PY

      - name: Build app
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX"
          cmake --build build --parallel

      - name: Codesign (ad-hoc)
        run: codesign --force --deep --sign - build/OpenMTR.app

      - name: Package into a DMG
        run: |
          hdiutil create -volname "OpenMTR" -srcfolder build/OpenMTR.app -ov -format UDZO build/OpenMTR.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: OpenMTR-macOS
          path: build/OpenMTR.dmg

  # Linux now builds a static, feature-trimmed Qt from source too, same as
  # Windows and macOS - rather than the old approach of linking against the
  # distro's full dynamic Qt package and having linuxdeploy-plugin-qt bundle
  # every Qt lib (and its transitive deps) into the AppImage. linuxdeploy is
  # still used, but without --plugin qt: there's no Qt runtime left to
  # bundle, it's just wrapping the (now much smaller) static binary plus the
  # desktop file/icon into a single-file AppImage for double-click
  # convenience. linuxdeploy's own excludelist already assumes core system
  # libs (glibc, libxcb, libX11, ...) are present on the target, so those
  # stay as ordinary dynamic runtime dependencies rather than being bundled.
  # Same platform-list caveat as macOS: filedialog/filesystemmodel/sizegrip
  # stay enabled here (Windows-only disables them), because the export
  # dialog on this platform goes through Qt's own QFileDialog.
  build-linux:
    strategy:
      matrix:
        include:
          - arch: amd64
            label: Linux AMD64
            runner: ubuntu-26.04
            linuxdeploy_arch: x86_64
            artifact: OpenMTR-Linux-AMD64
          - arch: arm64
            label: Linux ARM64
            runner: ubuntu-26.04-arm
            linuxdeploy_arch: aarch64
            artifact: OpenMTR-Linux-ARM64

    runs-on: ${{ matrix.runner }}
    name: Build (${{ matrix.label }})
    env:
      QT_PREFIX: /home/runner/Qt-static
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Restore Qt cache
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.QT_PREFIX }}
          key: qt-static-${{ env.QT_VERSION }}-linux-${{ matrix.arch }}-${{ env.QT_CACHE_SUFFIX }}

      - name: Install build & Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config perl python3 \
            xz-utils libfuse2 \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev \
            libxrender-dev libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev \
            libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxcb-xkb-dev libxcb-util-dev libxcb-render0-dev libxcb-render-util0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libdbus-1-dev libglib2.0-dev zlib1g-dev

      - name: Fetch Qt source
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          base="https://download.qt.io/official_releases/qt/6.11/${{ env.QT_VERSION }}/submodules"
          wget -q "$base/qtbase-everywhere-src-${{ env.QT_VERSION }}.tar.xz" -O qtbase.tar.xz
          mkdir -p /home/runner/Qt-src
          tar -xf qtbase.tar.xz -C /home/runner/Qt-src

      - name: Configure, build & install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          cd /home/runner/Qt-src/qtbase-everywhere-src-${{ env.QT_VERSION }}
          ./configure \
            -prefix "$QT_PREFIX" \
            -release -static \
            -platform linux-g++ \
            -no-opengl \
            -c++std c++20 \
            -nomake examples -nomake tests \
            -no-feature-sql -no-feature-printsupport -no-feature-concurrent \
            -no-feature-systemtrayicon -no-feature-whatsthis -no-feature-wizard \
            -no-feature-colordialog -no-feature-fontdialog \
            -no-feature-mdiarea -no-feature-dockwidget \
            -no-feature-jpeg -no-feature-gif \
            -no-feature-imageformat_ppm \
            -no-feature-imageformat_xbm \
            -no-feature-image_heuristic_mask -no-feature-image_text \
            -no-feature-movie \
            -no-feature-picture \
            -no-feature-pdf \
            -no-feature-textmarkdownreader -no-feature-textmarkdownwriter \
            -no-feature-textodfwriter \
            -no-feature-emojisegmenter \
            -no-feature-translation \
            -no-feature-undocommand -no-feature-undostack -no-feature-undogroup \
            -no-feature-statustip \
            -no-feature-tabbar -no-feature-tabwidget \
            -no-feature-fontcombobox \
            -no-feature-listwidget \
            -no-feature-treewidget \
            -no-feature-mimetype \
            -no-feature-toolbox \
            -no-feature-calendarwidget -no-feature-datetimeedit \
            -no-feature-dial -no-feature-lcdnumber \
            -no-feature-rubberband \
            -no-feature-textedit -no-feature-textbrowser \
            -no-feature-progressbar -no-feature-progressdialog \
            -no-feature-inputdialog -no-feature-messagebox -no-feature-errormessage \
            -no-feature-undoview \
            -no-feature-graphicsview -no-feature-graphicseffect \
            -confirm-license -opensource \
            -- -B /home/runner/Qt-build
          cmake --build /home/runner/Qt-build --parallel
          cmake --install /home/runner/Qt-build

      - name: Generate Qt forwarding headers
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 - "$QT_PREFIX" <<'PY'
          import re, pathlib, sys
          prefix = pathlib.Path(sys.argv[1])
          pattern = re.compile(
              r'^ *(?:template\s*<[^>]*>\s*)?(?:class|struct)\s+(?:Q_\w+_EXPORT\s+)(Q[A-Za-z0-9_]+)',
              re.M)
          for module in ('QtWidgets', 'QtGui', 'QtCore', 'QtNetwork'):
              d = prefix / 'include' / module
              if not d.is_dir():
                  continue
              for h in d.glob('q*.h'):
                  content = h.read_text(errors='ignore')
                  for m in pattern.finditer(content):
                      name = m.group(1)
                      if name.endswith('Private'):
                          continue
                      fwd = d / name
                      if not fwd.exists():
                          fwd.write_text(f'#include "{h.name}"')
          PY

      - name: Configure & build app
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel

      - name: Install into AppDir
        run: cmake --install build --prefix AppDir/usr

      - name: Fetch linuxdeploy
        run: |
          base="https://github.com/linuxdeploy"
          wget -q "$base/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.linuxdeploy_arch }}.AppImage"
          chmod +x linuxdeploy-*.AppImage

      - name: Build AppImage
        env:
          # Squashing the AppImage's own FUSE mount inside a container
          # without --privileged is unreliable; extract-and-run avoids it.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          ./linuxdeploy-${{ matrix.linuxdeploy_arch }}.AppImage \
            --appdir AppDir \
            --output appimage \
            --desktop-file openmtr.desktop \
            --icon-file app_icon.png

      - name: Rename artifact
        run: mv OpenMTR*.AppImage OpenMTR-${{ matrix.arch }}.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: OpenMTR-${{ matrix.arch }}.AppImage
