name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]

env:
  QT_VERSION: 6.11.1
  # Zvedni při změně configure flagů → vynutí rebuild Qt cache
  QT_CACHE_KEY: v1

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Qt static cache — builduje se jen pokud cache chybí.
  # ────────────────────────────────────────────────────────────────────────────
  qt-static-amd64:
    runs-on: windows-latest
    steps:
      - name: Check cache
        id: cache
        uses: actions/cache@v4
        with:
          path: C:\Qt-static
          key: qt-static-${{ env.QT_VERSION }}-amd64-${{ env.QT_CACHE_KEY }}
          lookup-only: true

      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          arch: x64

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Download Qt source
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://download.qt.io/official_releases/qt/6.11/${{ env.QT_VERSION }}/submodules/qtbase-everywhere-src-${{ env.QT_VERSION }}.zip" `
            -OutFile qtbase.zip -TimeoutSec 600
          Expand-Archive qtbase.zip -DestinationPath C:\Qt-src

      - name: Build Qt static (AMD64)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          mkdir C:\Qt-build && cd C:\Qt-build
          C:\Qt-src\qtbase-everywhere-src-${{ env.QT_VERSION }}\configure.bat ^
            -prefix C:\Qt-static ^
            -release -static -static-runtime ^
            -platform win32-msvc -opengl desktop ^
            -c++std c++20 ^
            -nomake examples -nomake tests ^
            -make libs ^
            -no-dbus -no-sql-sqlite -no-sql-odbc ^
            -- -DCMAKE_BUILD_PARALLEL_LEVEL=4
          cmake --build . --parallel 4
          cmake --install .

      - name: Save cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Qt-static
          key: qt-static-${{ env.QT_VERSION }}-amd64-${{ env.QT_CACHE_KEY }}

  qt-static-arm64:
    runs-on: windows-latest
    steps:
      - name: Check cache
        id: cache
        uses: actions/cache@v4
        with:
          path: C:\Qt-static-arm64
          key: qt-static-${{ env.QT_VERSION }}-arm64-${{ env.QT_CACHE_KEY }}
          lookup-only: true

      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          arch: amd64_arm64

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Download Qt source
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://download.qt.io/official_releases/qt/6.11/${{ env.QT_VERSION }}/submodules/qtbase-everywhere-src-${{ env.QT_VERSION }}.zip" `
            -OutFile qtbase.zip -TimeoutSec 600
          Expand-Archive qtbase.zip -DestinationPath C:\Qt-src

      - name: Build Qt static (ARM64 cross-compile)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          mkdir C:\Qt-build-arm64 && cd C:\Qt-build-arm64
          C:\Qt-src\qtbase-everywhere-src-${{ env.QT_VERSION }}\configure.bat ^
            -prefix C:\Qt-static-arm64 ^
            -release -static -static-runtime ^
            -platform win32-msvc -opengl desktop ^
            -c++std c++20 ^
            -nomake examples -nomake tests ^
            -make libs ^
            -no-dbus -no-sql-sqlite -no-sql-odbc ^
            -- -DCMAKE_BUILD_PARALLEL_LEVEL=4 ^
               -DCMAKE_SYSTEM_NAME=Windows ^
               -DCMAKE_SYSTEM_PROCESSOR=ARM64
          cmake --build . --parallel 4
          cmake --install .

      - name: Save cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Qt-static-arm64
          key: qt-static-${{ env.QT_VERSION }}-arm64-${{ env.QT_CACHE_KEY }}

  # ────────────────────────────────────────────────────────────────────────────
  # AMD64 build
  # ────────────────────────────────────────────────────────────────────────────
  build-amd64:
    needs: qt-static-amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Qt static (AMD64)
        uses: actions/cache/restore@v4
        with:
          path: C:\Qt-static
          key: qt-static-${{ env.QT_VERSION }}-amd64-${{ env.QT_CACHE_KEY }}
          fail-on-cache-miss: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release AMD64
        run: msbuild OpenMTR.sln /p:Configuration=Release /p:Platform=x64 /p:QT_ROOT_DIR="C:\Qt-static" /m

      - name: Collect artifact
        shell: pwsh
        run: |
          $exe = "bin\x64\Release\OpenMTR.exe"
          Write-Host "Velikost: $([math]::Round((Get-Item $exe).Length/1MB,2)) MB"
          Copy-Item $exe OpenMTR-AMD64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: OpenMTR-AMD64
          path: OpenMTR-AMD64.exe

  # ────────────────────────────────────────────────────────────────────────────
  # ARM64 build (cross-compile na windows-latest, stejně jako dosud)
  # ────────────────────────────────────────────────────────────────────────────
  build-arm64:
    needs: qt-static-arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Qt static (ARM64 libs)
        uses: actions/cache/restore@v4
        with:
          path: C:\Qt-static-arm64
          key: qt-static-${{ env.QT_VERSION }}-arm64-${{ env.QT_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Restore Qt static (AMD64 host tools — moc.exe, rcc.exe)
        uses: actions/cache/restore@v4
        with:
          path: C:\Qt-static
          key: qt-static-${{ env.QT_VERSION }}-amd64-${{ env.QT_CACHE_KEY }}
          fail-on-cache-miss: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release ARM64
        run: |
          msbuild OpenMTR.sln ^
            /p:Configuration=Release /p:Platform=ARM64 ^
            /p:QT_ROOT_DIR="C:\Qt-static-arm64" ^
            /p:QT_HOST_DIR="C:\Qt-static" ^
            /m

      - name: Collect artifact
        shell: pwsh
        run: |
          $exe = "bin\ARM64\Release\OpenMTR.exe"
          Write-Host "Velikost: $([math]::Round((Get-Item $exe).Length/1MB,2)) MB"
          Copy-Item $exe OpenMTR-ARM64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: OpenMTR-ARM64
          path: OpenMTR-ARM64.exe

  # ────────────────────────────────────────────────────────────────────────────
  # Release při tagu v*.*.*
  # ────────────────────────────────────────────────────────────────────────────
  release:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
