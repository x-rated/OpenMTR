name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]

env:
  QT_VERSION: 6.11.1
  QT_CACHE_KEY: v5

jobs:
  # ── AMD64: Kompletní sestavení Qt + OpenMTR ──────────────────────────────────
  build-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Qt AMD64 Cache
        id: cache-qt
        uses: actions/cache/restore@v4
        with:
          path: C:\Qt-static
          key: qt-static-${{ env.QT_VERSION }}-amd64-${{ env.QT_CACHE_KEY }}

      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.cache-qt.outputs.cache-hit != 'true'
        with:
          arch: x64

      - uses: actions/setup-python@v5
        if: steps.cache-qt.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Install Ninja
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install ninja -y

      - name: Download Qt source
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://download.qt.io/official_releases/qt/6.11/${{ env.QT_VERSION }}/submodules/qtbase-everywhere-src-${{ env.QT_VERSION }}.zip" `
            -OutFile qtbase.zip -TimeoutSec 600
          Expand-Archive qtbase.zip -DestinationPath C:\Qt-src
          Invoke-WebRequest `
            "https://download.qt.io/official_releases/qt/6.11/${{ env.QT_VERSION }}/submodules/qtsvg-everywhere-src-${{ env.QT_VERSION }}.zip" `
            -OutFile qtsvg.zip -TimeoutSec 300
          Expand-Archive qtsvg.zip -DestinationPath C:\Qt-src

      - name: Build and install Qt static + qtsvg (AMD64)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          if exist C:\Qt-build-amd64 rmdir /s /q C:\Qt-build-amd64
          mkdir C:\Qt-build-amd64
          cd C:\Qt-build-amd64
          C:\Qt-src\qtbase-everywhere-src-${{ env.QT_VERSION }}\configure.bat ^
            -prefix C:\Qt-static ^
            -release -static -static-runtime ^
            -platform win32-msvc ^
            -opengl desktop ^
            -c++std c++20 ^
            -nomake examples -nomake tests ^
            -confirm-license -opensource
          if errorlevel 1 exit /b 1
          cmake --build . --parallel 4
          if errorlevel 1 exit /b 1
          cmake --install .
          if errorlevel 1 exit /b 1
          if exist C:\Qt-build-svg rmdir /s /q C:\Qt-build-svg
          cmake -S C:\Qt-src\qtsvg-everywhere-src-${{ env.QT_VERSION }} ^
                -B C:\Qt-build-svg ^
                -G Ninja ^
                -DCMAKE_BUILD_TYPE=Release ^
                -DCMAKE_PREFIX_PATH=C:\Qt-static ^
                -DCMAKE_INSTALL_PREFIX=C:\Qt-static ^
                -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if errorlevel 1 exit /b 1
          cmake --build C:\Qt-build-svg --parallel 4
          if errorlevel 1 exit /b 1
          cmake --install C:\Qt-build-svg

      - name: Save Qt AMD64 Cache
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Qt-static
          key: qt-static-${{ env.QT_VERSION }}-amd64-${{ env.QT_CACHE_KEY }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure OpenMTR (AMD64)
        shell: cmd
        run: |
          if exist build-amd64 rmdir /s /q build-amd64
          mkdir build-amd64
          cd build-amd64
          cmake .. ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH=C:\Qt-static ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build OpenMTR (AMD64)
        shell: cmd
        run: cd build-amd64 && cmake --build . --parallel 4

      - name: Collect artifact (AMD64)
        shell: pwsh
        run: |
          $exe = "build-amd64\OpenMTR.exe"
          Write-Host "Velikost: $([math]::Round((Get-Item $exe).Length/1MB,2)) MB"
          Copy-Item $exe OpenMTR-AMD64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: OpenMTR-AMD64
          path: OpenMTR-AMD64.exe

  # ── ARM64: Kompletní sestavení Qt + OpenMTR ──────────────────────────────────
  build-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Qt ARM64 Cache
        id: cache-qt-arm64
        uses: actions/cache@v4
        with:
          path: C:\Qt-static-arm64
          key: qt-static-${{ env.QT_VERSION }}-arm64-${{ env.QT_CACHE_KEY }}

      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.cache-qt-arm64.outputs.cache-hit != 'true'
        with:
          arch: amd64_arm64

      - uses: actions/setup-python@v5
        if: steps.cache-qt-arm64.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Install Ninja
        if: steps.cache-qt-arm64.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install ninja -y

      - name: Download Qt source
        if: steps.cache-qt-arm64.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://download.qt.io/official_releases/qt/6.11/${{ env.QT_VERSION }}/submodules/qtbase-everywhere-src-${{ env.QT_VERSION }}.zip" `
            -OutFile qtbase.zip -TimeoutSec 600
          Expand-Archive qtbase.zip -DestinationPath C:\Qt-src
          Invoke-WebRequest `
            "https://download.qt.io/official_releases/qt/6.11/${{ env.QT_VERSION }}/submodules/qtsvg-everywhere-src-${{ env.QT_VERSION }}.zip" `
            -OutFile qtsvg.zip -TimeoutSec 300
          Expand-Archive qtsvg.zip -DestinationPath C:\Qt-src

      - name: Build and install Qt static + qtsvg (ARM64)
        if: steps.cache-qt-arm64.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          if exist C:\Qt-build-arm64 rmdir /s /q C:\Qt-build-arm64
          mkdir C:\Qt-build-arm64
          cd C:\Qt-build-arm64
          C:\Qt-src\qtbase-everywhere-src-${{ env.QT_VERSION }}\configure.bat ^
            -prefix C:\Qt-static-arm64 ^
            -release -static -static-runtime ^
            -platform win32-msvc ^
            -opengl desktop ^
            -c++std c++20 ^
            -nomake examples -nomake tests ^
            -confirm-license -opensource ^
            -- -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=ARM64
          if errorlevel 1 exit /b 1
          cmake --build . --parallel 4
          if errorlevel 1 exit /b 1
          cmake --install .
          if errorlevel 1 exit /b 1
          if exist C:\Qt-build-svg-arm64 rmdir /s /q C:\Qt-build-svg-arm64
          cmake -S C:\Qt-src\qtsvg-everywhere-src-${{ env.QT_VERSION }} ^
                -B C:\Qt-build-svg-arm64 ^
                -G Ninja ^
                -DCMAKE_BUILD_TYPE=Release ^
                -DCMAKE_PREFIX_PATH=C:\Qt-static-arm64 ^
                -DCMAKE_INSTALL_PREFIX=C:\Qt-static-arm64 ^
                -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
                -DCMAKE_SYSTEM_NAME=Windows ^
                -DCMAKE_SYSTEM_PROCESSOR=ARM64
          if errorlevel 1 exit /b 1
          cmake --build C:\Qt-build-svg-arm64 --parallel 4
          if errorlevel 1 exit /b 1
          cmake --install C:\Qt-build-svg-arm64

      - name: Save Qt ARM64 Cache
        if: steps.cache-qt-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Qt-static-arm64
          key: qt-static-${{ env.QT_VERSION }}-arm64-${{ env.QT_CACHE_KEY }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Install Ninja (Kompilace OpenMTR ARM64)
        shell: pwsh
        run: choco install ninja -y

      - name: Configure OpenMTR (ARM64)
        shell: cmd
        run: |
          if exist build-arm64 rmdir /s /q build-arm64
          mkdir build-arm64
          cd build-arm64
          cmake .. ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH=C:\Qt-static-arm64 ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DCMAKE_SYSTEM_NAME=Windows ^
            -DCMAKE_SYSTEM_PROCESSOR=ARM64

      - name: Build OpenMTR (ARM64)
        shell: cmd
        run: cd build-arm64 && cmake --build . --parallel 4

      - name: Collect artifact (ARM64)
        shell: pwsh
        run: |
          $exe = "build-arm64\OpenMTR.exe"
          Write-Host "Velikost: $([math]::Round((Get-Item $exe).Length/1MB,2)) MB"
          Copy-Item $exe OpenMTR-ARM64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: OpenMTR-ARM64
          path: OpenMTR-ARM64.exe

  # ── ARM
