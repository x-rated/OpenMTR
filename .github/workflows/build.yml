name: Build OpenMTR (Multi-Arch)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            qt_arch: win64_msvc2022_64
            msvc_arch: x64
          - arch: arm64
            qt_arch: win64_msvc2022_arm64
            msvc_arch: x64_arm64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Instalace Qt6 - odstraněn problematický modul 'qtsvg'
    - name: Install Qt6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.2'
        host: 'windows'
        target: 'desktop'
        arch: ${{ matrix.qt_arch }}

    # 2. Nastavení MSVC kompilátoru
    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.msvc_arch }}

    # 3. Konfigurace CMake
    - name: Configure CMake
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }}

    # 4. Kompilace aplikace
    - name: Build Project
      run: |
        cmake --build build --config Release

    # 5. Přejmenování výsledného exe souboru podle architektury
    - name: Rename executable
      shell: pwsh
      run: |
        if (Test-Path "build/Release/OpenMTR.exe") {
          Move-Item "build/Release/OpenMTR.exe" "build/Release/OpenMTR-${{ matrix.arch }}.exe"
        } elseif (Test-Path "build/OpenMTR.exe") {
          Move-Item "build/OpenMTR.exe" "build/OpenMTR-${{ matrix.arch }}.exe"
        }

    # 6. Nahrání hotového .exe souboru na GitHub
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenMTR-Windows-${{ matrix.arch }}
        path: |
          build/Release/OpenMTR-${{ matrix.arch }}.exe
          build/OpenMTR-${{ matrix.arch }}.exe
