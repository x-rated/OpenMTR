name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]

jobs:
  build-amd64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@refs/pull/1000/head'

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Update Qt path in project
        shell: pwsh
        run: |
          $qtDir = $env:QT_ROOT_DIR
          Write-Host "Qt root dir: $qtDir"
          (Get-Content OpenMTR.vcxproj) `
            -replace 'C:\\Qt\\6\.11\.1\\msvc2022_64', $qtDir `
            | Set-Content OpenMTR.vcxproj

      - name: Build Release
        run: msbuild OpenMTR.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Deploy Qt DLLs
        shell: pwsh
        run: |
          $windeployqt = "$env:QT_ROOT_DIR\bin\windeployqt6.exe"
          & $windeployqt --release --no-translations --no-system-d3d-compiler bin\x64\Release\OpenMTR.exe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-evb-v1

      - name: Install EVB tools
        run: npm install enigmavirtualbox generate-evb

      - name: Pack single exe
        run: node .github/workflows/pack.js bin\x64\Release OpenMTR.exe

      - name: Show packed exe size
        shell: pwsh
        run: Get-Item OpenMTR.exe | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}}

      - name: Rename AMD64 exe
        shell: pwsh
        run: Rename-Item OpenMTR.exe OpenMTR-AMD64.exe

      - name: Upload AMD64 exe
        uses: actions/upload-artifact@v4
        with:
          name: OpenMTR-AMD64
          path: OpenMTR-AMD64.exe

  build-arm64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 AMD64 (windeployqt + cross tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@refs/pull/1000/head'

      - name: Install Qt6 ARM64 (libraries)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_arm64_cross_compiled'
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@refs/pull/1000/head'

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Update Qt path in project for ARM64
        shell: pwsh
        run: |
          $qtAmd64 = $env:QT_ROOT_DIR
          $qtArm64 = (Get-ChildItem "$env:RUNNER_TEMP\Qt" -Recurse -Directory | Where-Object { $_.Name -like "msvc2022_arm64*" } | Select-Object -First 1).FullName
          Write-Host "Qt AMD64 (host): $qtAmd64"
          Write-Host "Qt ARM64 (target): $qtArm64"
          # Replace Qt target path with ARM64 kit
          (Get-Content OpenMTR.vcxproj) `
            -replace 'C:\\Qt\\6\.11\.1\\msvc2022_64', $qtArm64 `
            | Set-Content OpenMTR.vcxproj
          # Hardcode moc/rcc to AMD64 host tools directly in vcxproj
          (Get-Content OpenMTR.vcxproj) `
            -replace [regex]::Escape("$qtArm64\bin\moc.exe"), "$qtAmd64\bin\moc.exe" `
            -replace [regex]::Escape("$qtArm64\bin\rcc.exe"), "$qtAmd64\bin\rcc.exe" `
            | Set-Content OpenMTR.vcxproj

      - name: Build Release ARM64
        run: msbuild OpenMTR.sln /p:Configuration=Release /p:Platform=ARM64 /m

      - name: Deploy Qt DLLs ARM64
        shell: pwsh
        run: |
          $windeployqt = "$env:QT_ROOT_DIR\bin\windeployqt6.exe"
          & $windeployqt --release --no-translations --no-system-d3d-compiler bin\ARM64\Release\OpenMTR.exe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-evb-v1

      - name: Install EVB tools
        run: npm install enigmavirtualbox generate-evb

      - name: Pack single exe ARM64
        run: node .github/workflows/pack.js bin\ARM64\Release OpenMTR.exe

      - name: Rename ARM64 exe
        shell: pwsh
        run: Rename-Item OpenMTR.exe OpenMTR-ARM64.exe

      - name: Upload ARM64 exe
        uses: actions/upload-artifact@v4
        with:
          name: OpenMTR-ARM64
          path: OpenMTR-ARM64.exe


  release:
    needs: [build-amd64, build-arm64]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@refs/pull/1000/head'

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Update Qt path in project
        shell: pwsh
        run: |
          $qtDir = $env:QT_ROOT_DIR
          (Get-Content OpenMTR.vcxproj) `
            -replace 'C:\\Qt\\6\.11\.1\\msvc2022_64', $qtDir `
            | Set-Content OpenMTR.vcxproj

      - name: Build Release
        run: msbuild OpenMTR.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Deploy Qt DLLs
        shell: pwsh
        run: |
          $windeployqt = "$env:QT_ROOT_DIR\bin\windeployqt6.exe"
          & $windeployqt --release --no-translations --no-system-d3d-compiler bin\x64\Release\OpenMTR.exe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-evb-v1

      - name: Install EVB tools
        run: npm install enigmavirtualbox generate-evb

      - name: Pack single exe
        run: node .github/workflows/pack.js bin\x64\Release OpenMTR.exe

      - name: Rename AMD64 exe
        shell: pwsh
        run: Rename-Item OpenMTR.exe OpenMTR-AMD64.exe

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenMTR-ARM64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OpenMTR-AMD64.exe
            OpenMTR-ARM64.exe
          generate_release_notes: true
