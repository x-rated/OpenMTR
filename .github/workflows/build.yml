name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]

env:
  QT_VERSION: 6.11.1
  QT_CACHE_KEY: v2

jobs:
  # ── Qt static AMD64 ──────────────────────────────────────────────────────────
  qt-static-amd64:
    runs-on: windows-latest
    steps:
      - name: Check cache
        id: cache
        uses: actions/cache@v4
        with:
          path: C:\Qt-static
          key: qt-static-${{ env.QT_VERSION }}-amd64-${{ env.QT_CACHE_KEY }}
          lookup-only: true

      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          arch: x64

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Install Ninja
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install ninja -y

      - name: Download Qt source
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://download.qt.io/official_releases/qt/6.11/${{ env.QT_VERSION }}/submodules/qtbase-everywhere-src-${{ env.QT_VERSION }}.zip" `
            -OutFile qtbase.zip -TimeoutSec 600
          Expand-Archive qtbase.zip -DestinationPath C:\Qt-src
          Invoke-WebRequest `
            "https://download.qt.io/official_releases/qt/6.11/${{ env.QT_VERSION }}/submodules/qtsvg-everywhere-src-${{ env.QT_VERSION }}.zip" `
            -OutFile qtsvg.zip -TimeoutSec 300
          Expand-Archive qtsvg.zip -DestinationPath C:\Qt-src

      - name: Build and install Qt static + qtsvg (AMD64)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          mkdir C:\Qt-build-amd64
          cd C:\Qt-build-amd64
          C:\Qt-src\qtbase-everywhere-src-${{ env.QT_VERSION }}\configure.bat ^
            -prefix C:\Qt-static ^
            -release -static -static-runtime ^
            -platform win32-msvc ^
            -opengl desktop ^
            -c++std c++20 ^
            -nomake examples -nomake tests ^
            -confirm-license -opensource
          if errorlevel 1 exit /b 1
          cmake --build . --parallel 4
          if errorlevel 1 exit /b 1
          cmake --install .
          if errorlevel 1 exit /b 1
          cmake -S C:\Qt-src\qtsvg-everywhere-src-${{ env.QT_VERSION }} ^
                -B C:\Qt-build-svg ^
                -G Ninja ^
                -DCMAKE_BUILD_TYPE=Release ^
                -DCMAKE_PREFIX_PATH=C:\Qt-static ^
                -DCMAKE_INSTALL_PREFIX=C:\Qt-static ^
                -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if errorlevel 1 exit /b 1
          cmake --build C:\Qt-build-svg --parallel 4
          if errorlevel 1 exit /b 1
          cmake --install C:\Qt-build-svg

      - name: Save cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Qt-static
          key: qt-static-${{ env.QT_VERSION }}-amd64-${{ env.QT_CACHE_KEY }}

  # ── Qt static ARM64 (cross-compile, potřebuje AMD64 host tools) ─────────────
  qt-static-arm64:
    needs: qt-static-amd64
    runs-on: windows-latest
    steps:
      - name: Check cache
        id: cache
        uses: actions/cache@v4
        with:
          path: C:\Qt-static-arm64
          key: qt-static-${{ env.QT_VERSION }}-arm64-${{ env.QT_CACHE_KEY }}
          lookup-only: true

      - name: Restore AMD64 Qt (host tools)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: C:\Qt-static
          key: qt-static-${{ env.QT_VERSION }}-amd64-${{ env.QT_CACHE_KEY }}
          fail-on-cache-miss: true

      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          arch: amd64_arm64

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Install Ninja
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install ninja -y

      - name: Download Qt source
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://download.qt.io/official_releases/qt/6.11/${{ env.QT_VERSION }}/submodules/qtbase-everywhere-src-${{ env.QT_VERSION }}.zip" `
            -OutFile qtbase.zip -TimeoutSec 600
          Expand-Archive qtbase.zip -DestinationPath C:\Qt-src
          Invoke-WebRequest `
            "https://download.qt.io/official_releases/qt/6.11/${{ env.QT_VERSION }}/submodules/qtsvg-everywhere-src-${{ env.QT_VERSION }}.zip" `
            -OutFile qtsvg.zip -TimeoutSec 300
          Expand-Archive qtsvg.zip -DestinationPath C:\Qt-src

      - name: Build and install Qt static + qtsvg (ARM64)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          mkdir C:\Qt-build-arm64
          cd C:\Qt-build-arm64
          C:\Qt-src\qtbase-everywhere-src-${{ env.QT_VERSION }}\configure.bat ^
            -prefix C:\Qt-static-arm64 ^
            -qt-host-path C:\Qt-static ^
            -release -static -static-runtime ^
            -platform win32-msvc ^
            -opengl desktop ^
            -c++std c++20 ^
            -nomake examples -nomake tests ^
            -confirm-license -opensource ^
            -- -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=ARM64
          if errorlevel 1 exit /b 1
          cmake --build . --parallel 4
          if errorlevel 1 exit /b 1
          cmake --install .
          if errorlevel 1 exit /b 1
          cmake -S C:\Qt-src\qtsvg-everywhere-src-${{ env.QT_VERSION }} ^
                -B C:\Qt-build-svg-arm64 ^
                -G Ninja ^
                -DCMAKE_BUILD_TYPE=Release ^
                -DCMAKE_PREFIX_PATH=C:\Qt-static-arm64 ^
                -DCMAKE_INSTALL_PREFIX=C:\Qt-static-arm64 ^
                -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
                -DCMAKE_SYSTEM_NAME=Windows ^
                -DCMAKE_SYSTEM_PROCESSOR=ARM64 ^
                -DQT_HOST_PATH=C:\Qt-static
          if errorlevel 1 exit /b 1
          cmake --build C:\Qt-build-svg-arm64 --parallel 4
          if errorlevel 1 exit /b 1
          cmake --install C:\Qt-build-svg-arm64

      - name: Save cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C
